<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Litecord stream</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #111214; color: #dbdee1;
    font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #status { position: fixed; left: 16px; bottom: 16px; padding: 6px 10px; border-radius: 6px;
    background: rgba(0, 0, 0, .6); }
  #status:empty { display: none; }
  #play { position: fixed; inset: 0; margin: auto; width: 180px; height: 48px; border: 0;
    border-radius: 8px; background: #5865f2; color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer; display: none; }
</style>
</head>
<body>
<div id="stage"><video id="video" autoplay playsinline muted controls></video></div>
<button id="play">Play with sound</button>
<div id="status">Connecting...</div>
<section id="manual" hidden style="position:fixed;inset:16px;background:#202225;padding:24px;overflow:auto;border-radius:8px">
  <h1>Litecord — teste manual / manual test</h1>
  <p>1. Copie a oferta e envie ao Litecord. / Copy the offer and send it to Litecord.</p>
  <textarea id="manual-offer" readonly style="width:100%;height:130px"></textarea>
  <p>2. Cole a resposta do Litecord e conecte. / Paste Litecord's answer and connect.</p>
  <textarea id="manual-answer" style="width:100%;height:130px"></textarea>
  <button id="manual-connect">Conectar / Connect</button>
  <p id="manual-error"></p>
</section>
<script>
const video = document.getElementById('video');
const status = document.getElementById('status');
const play = document.getElementById('play');
const pt = navigator.language.startsWith('pt');
const text = pt ? {
  connecting: 'Conectando à transmissão…', playing: '', sound: 'Ativar som',
  ended: 'A transmissão foi encerrada.', full: 'A transmissão já tem 3 espectadores.',
  invalid: 'Link inválido ou acesso recusado. Peça um novo link a quem está transmitindo.',
  network: 'Não foi possível conectar diretamente. A rede pode bloquear UDP ou exigir um relay TURN.',
  unavailable: 'Transmissão indisponível. Confira se o compartilhamento web está ligado.',
  secure: 'Abra este link usando HTTPS para assistir.',
} : {
  connecting: 'Connecting to the stream…', playing: '', sound: 'Enable sound',
  ended: 'The stream has ended.', full: 'The stream already has 3 viewers.',
  invalid: 'Invalid link or access denied. Ask the streamer for a new link.',
  network: 'Could not connect directly. This network may block UDP or require a TURN relay.',
  unavailable: 'Stream unavailable. Check that web sharing is enabled.',
  secure: 'Open this link using HTTPS to watch.',
};
document.documentElement.lang = pt ? 'pt-BR' : 'en';
play.textContent = text.sound;
const say = (state) => { status.textContent = text[state]; status.dataset.state = state; };
let pc, ws, ping, deadline, ended = false;
function finish(state) {
  if (ended) return;
  ended = true;
  clearInterval(ping); clearTimeout(deadline);
  pc?.close(); ws?.close(); video.srcObject = null;
  play.style.display = 'none'; say(state);
}

const bytesToBase64 = bytes => btoa(String.fromCharCode(...bytes));
const base64ToBytes = value => Uint8Array.from(atob(value), c => c.charCodeAt(0));
async function seal(key, value) {
  const nonce = crypto.getRandomValues(new Uint8Array(12));
  const encrypted = new Uint8Array(await crypto.subtle.encrypt({name: 'AES-GCM', iv: nonce}, key,
    new TextEncoder().encode(JSON.stringify(value))));
  const packed = new Uint8Array(nonce.length + encrypted.length);
  packed.set(nonce); packed.set(encrypted, nonce.length);
  return bytesToBase64(packed);
}
async function open(key, value) {
  if (typeof value !== 'string' || value.length > 96 * 1024) throw new Error('Invalid answer');
  const packed = base64ToBytes(value);
  const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: packed.slice(0, 12)}, key, packed.slice(12));
  return JSON.parse(new TextDecoder().decode(plain));
}

async function connect() {
  say('connecting');
  const params = new URLSearchParams(location.hash.slice(1));
  if (params.has('manual')) return connectManual();
  const room = params.get('room') || '';
  const secret = params.get('key') || '';
  if (!/^[a-f0-9]{32}$/.test(room) || !/^[a-f0-9]{64}$/.test(secret)) return finish('invalid');
  if (!window.isSecureContext || !crypto.subtle) return finish('secure');
  const raw = Uint8Array.from(secret.match(/../g), h => parseInt(h, 16));
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']);
  pc = new RTCPeerConnection({iceServers: [{urls: ['stun:stun.cloudflare.com:3478', 'stun:stun.l.google.com:19302']}]});
  pc.addTransceiver('video', { direction: 'recvonly' });
  pc.addTransceiver('audio', { direction: 'recvonly' });
  const stream = new MediaStream();
  pc.ontrack = (e) => {
    stream.addTrack(e.track);
    video.srcObject = stream;
  };
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'failed') finish('network');
  };
  video.onplaying = () => { clearTimeout(deadline); say('playing'); if (video.muted) play.style.display = 'block'; };
  play.onclick = () => { video.muted = false; video.play().catch(() => {}); play.style.display = 'none'; };
  const url = new URL('/web/ws', location.href);
  url.protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  url.search = new URLSearchParams({room, role: 'viewer'});
  ws = new WebSocket(url);
  deadline = setTimeout(() => finish('unavailable'), 20000);
  let offered = false;
  ws.onmessage = async event => {
    try {
      const message = JSON.parse(event.data);
      if (message.op === 'ready' && !offered) {
        offered = true;
        ping = setInterval(() => { if (ws.readyState === WebSocket.OPEN) ws.send('{"op":"ping"}'); }, 40000);
        await pc.setLocalDescription(await pc.createOffer());
        // Complete gathering before sending SDP: no trickle-ICE messages are needed.
        if (pc.iceGatheringState !== 'complete') await new Promise(resolve => {
          const timer = setTimeout(done, 5000);
          function done() { clearTimeout(timer); pc.removeEventListener('icegatheringstatechange', check); resolve(); }
          function check() { if (pc.iceGatheringState === 'complete') done(); }
          pc.addEventListener('icegatheringstatechange', check); check();
        });
        if (!ended) ws.send(JSON.stringify({op: 'offer', payload: await seal(key, pc.localDescription)}));
      } else if (message.op === 'answer') {
        await pc.setRemoteDescription(await open(key, message.payload));
        clearTimeout(deadline); deadline = setTimeout(() => finish('network'), 20000);
      } else if (message.op === 'ended') finish('ended');
      else if (message.op === 'reject') finish(message.status === 409 ? 'full' : 'invalid');
    } catch { finish('invalid'); }
  };
  ws.onerror = () => finish('unavailable');
  ws.onclose = () => { if (!ended) finish('ended'); };
  // Local test instrumentation can inspect RTCPeerConnection through its own wrapper.
  window.addEventListener('pagehide', () => finish('ended'), {once: true});
}

async function connectManual() {
  const panel = document.getElementById('manual'); panel.hidden = false;
  pc = new RTCPeerConnection({iceServers: [{urls: ['stun:stun.cloudflare.com:3478', 'stun:stun.l.google.com:19302']}]});
  pc.addTransceiver('video', {direction: 'recvonly'});
  pc.addTransceiver('audio', {direction: 'recvonly'});
  const stream = new MediaStream();
  pc.ontrack = event => { stream.addTrack(event.track); video.srcObject = stream; };
  pc.onconnectionstatechange = () => { if (pc.connectionState === 'failed') finish('network'); };
  video.onplaying = () => { clearTimeout(deadline); say('playing'); if (video.muted) play.style.display = 'block'; };
  play.onclick = () => { video.muted = false; video.play().catch(() => {}); play.style.display = 'none'; };
  await pc.setLocalDescription(await pc.createOffer());
  if (pc.iceGatheringState !== 'complete') await new Promise(resolve => {
    const timeout = setTimeout(done, 5000);
    function done() { clearTimeout(timeout); pc.removeEventListener('icegatheringstatechange', check); resolve(); }
    function check() { if (pc.iceGatheringState === 'complete') done(); }
    pc.addEventListener('icegatheringstatechange', check); check();
  });
  document.getElementById('manual-offer').value = JSON.stringify(pc.localDescription);
  document.getElementById('manual-connect').onclick = async () => {
    try {
      await pc.setRemoteDescription(JSON.parse(document.getElementById('manual-answer').value));
      panel.hidden = true;
      deadline = setTimeout(() => finish('network'), 20000);
    } catch { document.getElementById('manual-error').textContent = text.invalid; }
  };
  window.addEventListener('pagehide', () => finish('ended'), {once: true});
}

connect().catch(() => finish('unavailable'));
</script>
</body>
</html>
