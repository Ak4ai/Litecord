name: Build & Release Litecord

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (Installer & Portable)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Windows Binary (Release)
        run: cargo build --release --bin litecord

      - name: Package Windows Portable (.zip)
        shell: pwsh
        run: |
          mkdir -p package_portable
          Copy-Item target/release/litecord.exe package_portable/
          Copy-Item README.md package_portable/ -ErrorAction SilentlyContinue
          Compress-Archive -Path package_portable/* -DestinationPath litecord-windows-x64-portable.zip

      - name: Build Windows Installer (Inno Setup)
        shell: pwsh
        run: |
          iscc installer.iss

      - name: Upload Windows Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: litecord-windows-x64-portable
          path: litecord-windows-x64-portable.zip

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Litecord-Setup-x64
          path: target/installer/Litecord-Setup-x64.exe

  build-linux:
    name: Build Linux (.tar.gz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libxkbcommon-x11-dev \
            libxkbcommon-x11-0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Linux Binary (Release)
        run: cargo build --release --bin litecord

      - name: Package Linux Binary (.tar.gz)
        run: |
          mkdir -p release-pkg
          cp target/release/litecord release-pkg/
          cp -r assets release-pkg/
          cp README.md release-pkg/ 2>/dev/null || true
          tar -czvf litecord-linux-x64.tar.gz -C release-pkg .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: litecord-linux-x64
          path: litecord-linux-x64.tar.gz

  create-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Display downloaded files
        run: ls -lh release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/Litecord-Setup-x64.exe
            release-artifacts/litecord-windows-x64-portable.zip
            release-artifacts/litecord-linux-x64.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
