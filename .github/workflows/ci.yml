name: CI Verification

on:
  push:
    branches: [ "dev", "feature/**", "fix/**" ]
  pull_request:
    branches: [ "dev", "main" ]
  workflow_dispatch:

jobs:
  check-linux:
    name: Check Linux Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libssl-dev libx11-dev libxcb1-dev libfontconfig1-dev libfreetype6-dev libgtk-3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "linux-ci"

      - name: Run Cargo Check
        run: cargo check --bin litecord

  check-windows:
    name: Check Windows Build
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "windows-ci"

      - name: Run Cargo Check
        run: cargo check --bin litecord
