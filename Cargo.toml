[package]
name = "litecord"
version = "0.3.8"
edition = "2021"
description = "Ultra-lightweight, high-performance native Discord client in Rust with custom speech ducking"
authors = ["Litecord Project"]
license = "MIT"
repository = "https://github.com/Ak4ai/Litecord"
readme = "README.md"

[dependencies]
slint = "1.9"
i-slint-backend-winit = "1.9"
tokio = { version = "1.43", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.23"
reqwest = { version = "0.12", features = ["json", "native-tls", "blocking"] }
tray-icon = "0.19"
winit = "0.30"
log = "0.4"
env_logger = "0.11"
futures-util = "0.3"
raw-window-handle = "0.6"
cpal = "0.15"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
opus-rs = "0.1.26"
davey = "0.1.4"
image = "0.25"
qrcode = "0.14"
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
rand = "0.8"
mimalloc = { version = "0.1", default-features = false }
cameras = "0.1"
jpeg-encoder = { version = "0.7", features = ["simd"] }
zune-jpeg = "0.4"
openh264 = "0.6"
socket2 = "0.5"
rayon = "1.10"

[[bin]]
name = "litecord"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Globalization",
    "Win32_Security_Cryptography",
    "Win32_System_Console",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_Media",
    "Win32_System_LibraryLoader",
] }
windows-capture = "2.0.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }
ashpd = { version = "0.13", default-features = false, features = ["async-io", "screencast"] }
libc = "0.2"

[build-dependencies]
slint-build = "1.9"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package.jpeg-encoder]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.release]
opt-level = 3
codegen-units = 16
lto = false
strip = true

