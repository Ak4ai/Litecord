[package]
name = "litecord"
version = "0.1.0"
edition = "2021"
description = "Ultra-lightweight, high-performance native Discord client in Rust with custom speech ducking"
authors = ["Litecord Project"]
license = "MIT"
repository = "https://github.com/Ak4ai/Litecord"
readme = "README.md"

[dependencies]
slint = "1.9"
i-slint-backend-winit = "1.9"
tokio = { version = "1.43", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "native-tls"] }
tray-icon = "0.19"
winit = "0.30"
log = "0.4"
env_logger = "0.11"
futures-util = "0.3"
raw-window-handle = "0.6"
cpal = "0.15"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
opus-rs = "0.1.26"
davey = "0.1.4"
image = "0.25"
qrcode = "0.14"
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
rand = "0.8"

[[bin]]
name = "litecord"
path = "src/main.rs"





[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Globalization", "Win32_Security_Cryptography", "Win32_System_Console"] }

[build-dependencies]
slint-build = "1.9"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
