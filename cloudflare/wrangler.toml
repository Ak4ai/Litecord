# Signaling worker for Litecord P2P screen sharing.
#
# Local test:   npx wrangler dev --ip 0.0.0.0 --port 8787
#               LITECORD_SIGNALING_URL=ws://<lan-ip>:8787  litecord
# Deploy:       npx wrangler deploy        (only when you mean to publish)

name = "litecord-signal"
main = "worker.js"
compatibility_date = "2024-09-23"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "SignalingRoom"

# No [[migrations]] block on purpose: the SignalingRoom class was created on the
# deployed worker before it was managed by wrangler, and Cloudflare rejects a
# "new class" migration for a class that already has objects (error 10074).
# Deploying this worker to a brand-new account needs, once:
#   [[migrations]]
#   tag = "v1"
#   new_sqlite_classes = ["SignalingRoom"]
